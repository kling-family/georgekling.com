<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one centered column on a deep-ocean page. Glass panels float over full-bleed game canvases. */
:root{
  --deep:#061428; --deep-2:#0b2547; --panel:rgba(10,28,56,.82); --panel-2:rgba(22,52,96,.75); --line:rgba(140,205,255,.22);
  --text:#eef6ff; --dim:#9fb6d8; --cyan:#3fd6ff; --cyan-d:#1593c4; --gold:#ffc83d; --gold-d:#d98e12; --hot:#ff5a3d; --hot-d:#c4321a;
  --good:#4be38a; --warn:#ffc83d; --bad:#ff4d4d;
  --fire:#ff6a3d; --water:#2fa8e0; --leaf:#4cbf5a; --stone:#a39383; --storm:#e9b81e; --shadow:#8a5ce6; --none:#9a948a;
  --display:"Fredoka","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
[hidden]{display:none!important}
body{background:radial-gradient(120% 80% at 50% 0%,#12396b 0%,var(--deep-2) 45%,var(--deep) 100%) fixed;color:var(--text);font-family:var(--body);font-weight:700;font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
#app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.box.np{padding:0;overflow:hidden}
.btn{font-family:var(--display);font-weight:600;font-size:17px;color:#10223d;background:linear-gradient(180deg,#ffe07a,var(--gold));border:0;border-radius:14px;padding:11px 18px;
  box-shadow:0 4px 0 var(--gold-d),0 8px 18px rgba(0,0,0,.3);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn.cyan{background:linear-gradient(180deg,#8eeaff,var(--cyan));box-shadow:0 4px 0 var(--cyan-d),0 8px 18px rgba(0,0,0,.3)}
.btn.hot{color:#fff;background:linear-gradient(180deg,#ff8a6a,var(--hot));box-shadow:0 4px 0 var(--hot-d),0 8px 18px rgba(0,0,0,.3)}
.btn.ghost{color:var(--text);background:var(--panel-2);border:1px solid var(--line);box-shadow:none}
.btn.sm{font-size:14px;padding:8px 12px;border-radius:11px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{justify-content:center}
.muted{color:var(--dim)}
.small{font-size:14px}
.chip{display:inline-block;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.06em;color:#fff;padding:3px 9px;border-radius:99px;vertical-align:middle;text-transform:uppercase;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.mon{width:100%;height:100%}
.mon svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
canvas.scene{display:block;width:100%;height:auto;touch-action:none}

/* title */
.title{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.logo{font-size:clamp(46px,12vw,96px);font-weight:700;line-height:.92;letter-spacing:-.01em;background:linear-gradient(180deg,#fff2a8 0%,var(--gold) 45%,#ff8a3d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #7a2e12) drop-shadow(0 12px 20px rgba(0,0,0,.45))}
.by{font-family:var(--display);font-weight:600;letter-spacing:.24em;font-size:13px;color:var(--cyan);text-transform:uppercase}
.title .box{width:100%;box-sizing:border-box}
.hint{font-size:13px;color:var(--dim)}
.plays{font-family:var(--display);font-weight:600;font-size:15px;color:var(--gold);background:rgba(255,200,61,.1);border:1px solid rgba(255,200,61,.35);border-radius:99px;padding:6px 14px}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* hud */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px}
.hud .name{font-family:var(--display);font-weight:600;font-size:20px}
.hud .stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-family:var(--display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.pill i{width:12px;height:12px;border-radius:50%;display:inline-block}
.zoom{display:inline-flex;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.zoom button{background:none;border:0;color:var(--text);font-family:var(--display);font-weight:600;font-size:18px;width:36px;height:34px}
.zoom button:hover{background:rgba(255,255,255,.08)}
.zoom span{font-family:var(--display);font-size:12px;letter-spacing:.08em;min-width:6ch;text-align:center;color:var(--dim)}
.worldwrap{position:relative}
.scene3d{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.prompt{z-index:2}
.tip3d{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:2;background:rgba(6,20,40,.7);border-radius:99px;padding:6px 14px;font-size:13px;white-space:nowrap;pointer-events:none}
.prompt{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:10px;background:rgba(8,22,46,.9)}
.prompt .who{font-family:var(--display);font-weight:600;font-size:18px}
.controls{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.controls .help{flex:1;min-width:230px;font-size:15px}
.hmore{margin-top:6px;color:var(--dim);font-size:14px}.hmore summary{cursor:pointer;font-family:var(--display);font-weight:600;color:var(--dim);font-size:13px;list-style:none;display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 10px}.hmore summary::-webkit-details-marker{display:none}.hmore[open] summary{margin-bottom:6px}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:5px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:14px;font-size:18px;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.dpad button:active{background:var(--cyan);color:#06213a}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.dpad.float{position:fixed;z-index:5;padding:6px;border-radius:22px;background:rgba(6,20,40,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dpad.float button{background:rgba(22,52,96,.82)}
.dpad.drag{outline:2px dashed var(--cyan);outline-offset:4px}
.dpad .grip{grid-area:2/2;place-self:center;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid var(--line);display:grid;grid-template-columns:repeat(2,5px);gap:4px;place-content:center;cursor:grab;touch-action:none}
.dpad .grip i{width:5px;height:5px;border-radius:50%;background:var(--dim)}
.dpad.drag .grip{cursor:grabbing;background:var(--cyan)}
.wild{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:10px}
.wild>div{text-align:center;font-size:14px;background:rgba(255,255,255,.04);border-radius:14px;padding:8px}
.wild .art{width:68px;height:68px;margin:0 auto}
.unknown svg{filter:brightness(0) opacity(.5)!important}

/* team */
.card{display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04)}
.card .art{width:76px;height:76px;flex:none}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.bar{height:10px;background:rgba(0,0,0,.4);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .5s ease;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.35)}
.bar.xp{height:6px}.bar.xp i{background:var(--cyan)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.dex>div{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.04);padding:6px}
.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:580px){.starters{grid-template-columns:1fr}}
.starter{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.starter .art{width:140px;height:140px}

/* battle */
.arena{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.4);
  background:radial-gradient(60% 40% at 75% 18%,rgba(255,255,255,.35),transparent 70%),linear-gradient(180deg,var(--s1) 0%,var(--s2) 34%,var(--s3) 56%,var(--g1) 56.2%,var(--g2) 100%)}
.arena::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 60%,transparent 55%,rgba(0,0,0,.35));pointer-events:none}
.side{position:absolute;display:flex;flex-direction:column;gap:10px;z-index:1}
.side.enemy{right:5%;top:6%;align-items:flex-end;width:58%}
.side.player{left:4%;bottom:5%;align-items:flex-start;width:60%}
.side .art{width:clamp(110px,28vw,200px);aspect-ratio:1;position:relative}
.side .plat{position:absolute;left:0;right:0;bottom:-6%;height:24%;border-radius:50%;background:radial-gradient(closest-side,var(--g3),rgba(0,0,0,.15) 80%,transparent);z-index:0}
.side .art .sprite{position:relative;z-index:1;width:100%;height:100%}
.tag{background:rgba(8,22,46,.82);border:1px solid var(--line);border-radius:14px;padding:9px 12px;width:min(100%,260px);box-sizing:border-box;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tag .top{display:flex;justify-content:space-between;gap:6px;font-family:var(--display);font-weight:600;font-size:16px;align-items:center}
.tag .hpn{font-size:12px;text-align:right;margin-top:4px;color:var(--dim);font-variant-numeric:tabular-nums}
.enemy .tag{order:-1}
.dialog{display:flex;flex-direction:column;gap:12px;min-height:160px}
#log{font-family:var(--display);font-weight:500;font-size:19px;min-height:52px;cursor:pointer}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;color:var(--text);text-align:left;font-family:var(--display);font-weight:600;font-size:17px;padding:10px 14px;display:flex;flex-direction:column;gap:1px;transition:background .12s,transform .12s;position:relative}
.opt small{font-family:var(--body);font-weight:700;font-size:13px;color:var(--dim)}
.opt .k{position:absolute;right:10px;top:9px;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.opt:focus,.opt:hover{background:rgba(63,214,255,.18);border-color:var(--cyan);outline:none;transform:translateY(-1px)}
.opt:disabled{opacity:.35;cursor:not-allowed;transform:none}
.keys{font-size:13px;color:var(--dim)}
.hit{animation:hit .45s ease}
@keyframes hit{0%,100%{transform:none;filter:none}25%{transform:translateX(-10px);filter:brightness(2.2)}50%{transform:translateX(9px)}75%{transform:translateX(-5px);filter:brightness(1.6)}}
.lunge-r{animation:lr .32s ease}.lunge-l{animation:ll .32s ease}
@keyframes lr{50%{transform:translate(26px,-14px) scale(1.05)}}@keyframes ll{50%{transform:translate(-26px,14px) scale(1.05)}}
.caught{animation:caught .8s ease-in forwards}
@keyframes caught{to{transform:scale(.05) rotate(240deg);opacity:0}}
.faint{animation:faint .6s ease-in forwards}
@keyframes faint{to{transform:translateY(40px);opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:5;font-family:var(--display);font-weight:600;font-size:16px;max-width:min(90vw,520px);text-align:center;margin:0;animation:pop .25s ease}
@keyframes pop{from{transform:translate(-50%,12px);opacity:0}}
.win{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.win h1{font-size:clamp(40px,10vw,72px);font-weight:700;background:linear-gradient(180deg,#fff2a8,var(--gold),#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7a2e12)}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:12px;font-size:15px}

/* cartoon motion */
.mon .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.squish{animation:squish 1.6s ease-in-out infinite;transform-origin:50% 95%}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.93)}}
.enter-r{animation:enterR .7s cubic-bezier(.2,1.6,.4,1) both}.enter-l{animation:enterL .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes enterR{from{transform:translateX(140%) scale(.4);opacity:0}}@keyframes enterL{from{transform:translateX(-140%) scale(.4);opacity:0}}
.lunge-r{animation:lr .42s ease}.lunge-l{animation:ll .42s ease}
@keyframes lr{0%{transform:none}22%{transform:translate(-14px,6px) scale(1.15,.84)}55%{transform:translate(40px,-22px) scale(.86,1.16)}75%{transform:translate(30px,-14px) scale(1.05,.95)}100%{transform:none}}
@keyframes ll{0%{transform:none}22%{transform:translate(14px,-6px) scale(1.15,.84)}55%{transform:translate(-40px,22px) scale(.86,1.16)}75%{transform:translate(-30px,14px) scale(1.05,.95)}100%{transform:none}}
.hit{animation:hit .55s ease}
@keyframes hit{0%{transform:none;filter:none}12%{transform:scale(1.3,.65) translateY(14%);filter:brightness(3) saturate(0)}30%{transform:scale(.85,1.2) translateX(-8px);filter:brightness(1.8)}50%{transform:scale(1.08,.92) translateX(7px);filter:none}70%{transform:scale(.97,1.03) translateX(-3px)}100%{transform:none}}
.faint{animation:faint .8s ease-in forwards}
@keyframes faint{30%{transform:translateY(-12px) rotate(-12deg) scale(1.05)}100%{transform:translateY(60px) rotate(25deg) scale(.4);opacity:0}}
.hop{animation:hop .5s ease 3}
@keyframes hop{0%,100%{transform:none}30%{transform:translateY(-24px) scale(.92,1.1)}60%{transform:scale(1.12,.88)}}
.shake{animation:shake .4s ease}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
.pop{position:absolute;z-index:5;font-family:var(--display);font-weight:700;pointer-events:none;transform:translate(-50%,-50%);color:#fff;-webkit-text-stroke:2px #1b1b2a;paint-order:stroke fill;animation:pop2 1s ease-out forwards;white-space:nowrap}
@keyframes pop2{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-90%) scale(1.25);opacity:1}40%{transform:translate(-50%,-100%) scale(1)}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
.net{position:absolute;z-index:4;pointer-events:none;transform:translate(-50%,-50%)}
.net.drop{animation:netdrop .45s cubic-bezier(.3,1.5,.6,1) both}
@keyframes netdrop{from{transform:translate(-50%,-260%) scale(.6) rotate(-20deg);opacity:0}}
.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{25%{transform:translate(-50%,-50%) rotate(-14deg)}75%{transform:translate(-50%,-50%) rotate(12deg)}}
.net.burst{animation:netburst .45s ease-in forwards}
@keyframes netburst{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.aura{position:absolute;inset:-10%;border-radius:50%;border:4px solid #ffe07a;box-shadow:0 0 30px #ffe07a,inset 0 0 30px #ffe07a;animation:aura 1s ease-out forwards;pointer-events:none;z-index:2}
@keyframes aura{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}

.shop{position:fixed;inset:0;z-index:20;background:rgba(3,10,24,.6);display:flex;align-items:center;justify-content:center;padding:16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.shop .box{width:min(640px,100%);max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.shop .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.shop .item{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--text);font-family:var(--display);font-weight:600;font-size:16px}
.shop .item small{font-family:var(--body);font-size:13px;color:var(--dim)}
.shop .item .price{color:var(--gold)}
.shop .item:hover,.shop .item:focus{border-color:var(--cyan);background:rgba(63,214,255,.15);outline:none}
.shop .item:disabled{opacity:.4}
.shop .mrow{display:flex;align-items:center;gap:10px}
.shop .mrow .art{width:44px;height:44px;flex:none}

.evolve{animation:evolve 2.4s ease-in-out}
@keyframes evolve{0%,100%{filter:none}10%,30%,50%,70%{filter:brightness(4) saturate(0);transform:scale(1.1)}20%,40%,60%,80%{filter:none;transform:scale(.9)}}
.arena.night{filter:brightness(.72) saturate(.85) hue-rotate(-12deg)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;width:100%}
.pcard{display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--pc,var(--cyan))}
.pcard.newp{border-top-color:var(--line)}
.pcard .pick{background:none;border:0;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:4px;border-radius:12px}
.pcard .pick:hover .art,.pcard .pick:focus .art{transform:translateY(-4px)}
.pcard .art{width:86px;height:86px;transition:transform .15s}
.pcard .initial{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:40px;background:var(--panel-2);border:2px dashed var(--line)}
#pform input,#pform textarea{font:inherit;background:rgba(0,0,0,.3);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
#pform input{flex:1;min-width:140px}
.shop textarea{font-family:ui-monospace,Menlo,monospace;background:rgba(0,0,0,.3);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;word-break:break-all}
.dot{width:26px;height:26px;border-radius:50%;border:3px solid transparent;padding:0}
.dot.on{border-color:#fff}
table.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;text-align:left}
table.lb th{font-family:var(--display);font-weight:600;font-size:13px;color:var(--dim);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.lb td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
table.lb td.top{color:var(--gold);font-weight:800}

.labwrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:700px){.labwrap{grid-template-columns:1fr}}
.labprev{display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center;position:sticky;top:12px}

function sizeCanvas(cv,aspect){const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||cv.parentElement.clientWidth;cv.width=Math.round(w*dpr);cv.height=Math.round(w*aspect*dpr)}

// The sea view used on the title and the world map
const SEA_ACROSS=196;
let MAPVIEW=null;
function runSeaView(cv,opts){
  sizeCanvas(cv,+cv.dataset.aspect);const ctx=cv.getContext('2d');let last=0;
  const view={cam:{x:100,y:70},hover:-1};
  const toWorld=e=>{const r=cv.getBoundingClientRect(),sc=cv.width/SEA_ACROSS;return {x:view.cam.x+((e.clientX-r.left)/r.width*cv.width-cv.width/2)/sc,y:view.cam.y+((e.clientY-r.top)/r.height*cv.height-cv.height/2)/sc}};
  const whirlOn=()=>opts.locks&&S&&S.pieces&&Object.keys(S.pieces).length>=5;
  const hit=p=>whirlOn()&&Math.hypot(p.x-WHIRL.x,p.y-WHIRL.y)<7?DEEP:ISLES.slice(0,MAIN).findIndex((s,i)=>{const o=isleOff(i);return p.x>o.x+2&&p.x<o.x+W-2&&p.y>o.y+2&&p.y<o.y+H-2});
  if(opts.onPick){cv.addEventListener('pointermove',e=>{view.hover=hit(toWorld(e));cv.style.cursor=view.hover>=0?'pointer':'default'});cv.addEventListener('pointerleave',()=>view.hover=-1);cv.addEventListener('click',e=>{const i=hit(toWorld(e));if(i>=0)startRide(i)})}
  const startRide=i=>{if(view.ride)return;if(i<MAIN&&i>=S.unlocked)return opts.onPick(i);const from=ISLES[S.at??0],to=i===DEEP?WHIRL:ISLES[i];
    const rider=(S.team.find(m=>SP[m.sp].el==='water')||{sp:'bubblop'}).sp;view.ride={i,from:{x:from.x,y:from.y+12},to:{x:to.x,y:to.y+(i===DEEP?0:12)},t0:performance.now(),dur:1700,sp:rider};SFX.whoosh()};
  view.pick=startRide;
  const loop=t=>{if(!cv.isConnected)return;const dt=last?Math.min(100,t-last):16;last=t;updStorms(dt);
    const sc=cv.width/SEA_ACROSS,cw=cv.width,ch=cv.height,locks=opts.locks;
    if(opts.drift){view.cam.x=100+Math.sin(t/9000)*5;view.cam.y=70+Math.cos(t/11000)*3}
    drawSea(ctx,view.cam,sc,t,cw,ch);
    if(locks){ctx.setLineDash([.9,1.1]);ctx.lineDashOffset=-t/400;ctx.lineWidth=.45;ctx.lineCap='round';
      for(let i=0;i<MAIN-1;i++){const a=ISLES[i],b=ISLES[i+1];ctx.strokeStyle=i+1<S.unlocked?'rgba(255,255,255,.85)':'rgba(255,255,255,.25)';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.setLineDash([])}
    ISLES.slice(0,MAIN).forEach((s,i)=>{if(view.hover!==i||(locks&&i>=S.unlocked))return;const o=isleOff(i);ctx.save();ctx.shadowColor='#fff6b0';ctx.shadowBlur=30;ctx.drawImage(buildTex(i),o.x,o.y,W,H);ctx.restore()});
    drawIslands(ctx,view.cam,sc,cw,ch,locks);
    if(locks)ISLES.slice(0,MAIN).forEach((s,i)=>{const m=genMap(i),o=isleOff(i),cx=o.x+m.champ.x+.5,cy=o.y+m.champ.y+.5;
      if(S.beaten.includes(i)){ctx.strokeStyle='#fff';ctx.lineWidth=.35;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,cy-4);ctx.stroke();ctx.fillStyle='#ffc83d';ctx.beginPath();ctx.moveTo(cx,cy-4);ctx.lineTo(cx+2.6,cy-3.2);ctx.lineTo(cx,cy-2.4);ctx.fill()}
      if(i===S.unlocked-1&&!S.beaten.includes(i)){const b=Math.sin(t/220)*.8;ctx.fillStyle='#ff5a3d';ctx.beginPath();ctx.moveTo(s.x-1.6,o.y-3.4+b);ctx.lineTo(s.x+1.6,o.y-3.4+b);ctx.lineTo(s.x,o.y-1+b);ctx.fill()}
      if(i>=S.unlocked){ctx.fillStyle='rgba(6,20,40,.75)';ctx.beginPath();ctx.roundRect(s.x-2.2,s.y-1.4,4.4,3.6,.6);ctx.fill();ctx.strokeStyle='rgba(6,20,40,.75)';ctx.lineWidth=.7;ctx.beginPath();ctx.arc(s.x,s.y-1.4,1.3,Math.PI,0);ctx.stroke();ctx.fillStyle='#ffc83d';ctx.beginPath();ctx.arc(s.x,s.y+.3,.45,0,7);ctx.fill()}});
    if(whirlOn()){ctx.save();ctx.translate(WHIRL.x,WHIRL.y);const g=ctx.createRadialGradient(0,0,0,0,0,7);g.addColorStop(0,'#04122e');g.addColorStop(.6,'#1c4cb4');g.addColorStop(1,'rgba(30,80,180,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();
      ctx.lineWidth=.35;for(let k=0;k<4;k++){ctx.strokeStyle=`rgba(220,245,255,${.8-k*.15})`;ctx.beginPath();for(let a=0;a<9;a+=.2){const rr=a*.65;ctx.lineTo(Math.cos(a+t/300+k*1.57)*rr,Math.sin(a+t/300+k*1.57)*rr)}ctx.stroke()}ctx.restore()}
    if(view.ride){const R=view.ride,k=Math.min(1,(t-R.t0)/R.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,x=R.from.x+(R.to.x-R.from.x)*e,y=R.from.y+(R.to.y-R.from.y)*e-Math.sin(k*Math.PI)*4,dir=R.to.x<R.from.x?-1:1;
      for(let j=1;j<14;j++){const kk=Math.max(0,e-j*.012);ctx.fillStyle=`rgba(255,255,255,${.5-j*.035})`;ctx.beginPath();ctx.arc(R.from.x+(R.to.x-R.from.x)*kk,R.from.y+(R.to.y-R.from.y)*kk+1.5,1.2+j*.15,0,7);ctx.fill()}
      const im=MIMG[R.sp],b=Math.sin(t/120)*.4;if(im){ctx.save();ctx.translate(x,y+b);ctx.scale(dir,1);ctx.drawImage(im,-7,-11,14,14);ctx.restore()}
      ctx.save();ctx.translate(x-1.2,y-14+b);ctx.scale(2.4,2.4);drawPerson(ctx,0,0,'down',t/90,HERO);ctx.restore();
      if(R.i===DEEP&&k>.7){ctx.fillStyle=`rgba(4,18,46,${(k-.7)/.3})`;ctx.beginPath();ctx.arc(WHIRL.x,WHIRL.y,8,0,7);ctx.fill()}
      if(k>=1){view.ride=null;opts.onPick(R.i)}}
    drawStorms(ctx,t,sc,false);
    ctx.setTransform(1,0,0,1,0,0);const fs=Math.max(11,cw/58);ctx.font=`600 ${fs}px Fredoka, sans-serif`;ctx.textAlign='center';
    if(whirlOn()){const fs=Math.max(11,cw/58);ctx.setTransform(1,0,0,1,0,0);ctx.font=`600 ${fs}px Fredoka, sans-serif`;ctx.textAlign='center';const lx=cw/2+(WHIRL.x-view.cam.x)*sc,ly=ch/2+(WHIRL.y+9.5-view.cam.y)*sc;ctx.lineWidth=fs/3.2;ctx.strokeStyle='rgba(6,20,40,.75)';ctx.strokeText('Whirlpool',lx,ly);ctx.fillStyle=view.hover===DEEP?'#ffe07a':'#bff4ff';ctx.fillText('Whirlpool',lx,ly)}
    ISLES.slice(0,MAIN).forEach((s,i)=>{const lock=locks&&i>=S.unlocked,txt=lock?'Locked':(locks?(i+1)+'  ':'')+s.name,lx=cw/2+(s.x-view.cam.x)*sc,ly=ch/2+(s.y+16.5-view.cam.y)*sc;
      ctx.lineWidth=fs/3.2;ctx.strokeStyle='rgba(6,20,40,.75)';ctx.lineJoin='round';ctx.strokeText(txt,lx,ly);ctx.fillStyle=view.hover===i?'#ffe07a':lock?'#9fb6d8':'#fff';ctx.fillText(txt,lx,ly)});
    requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
  return view;
}

// ---- save codes: a copyable backup of one player's whole game ----
function encodeSave(){return 'MI1:'+btoa(unescape(encodeURIComponent(JSON.stringify({name:PROFILE?PROFILE.name:'Player',color:PROFILE?PROFILE.color:0,save:S}))))}
function decodeSave(code){try{code=code.trim().replace(/\s+/g,'');if(!code.startsWith('MI1:'))return null;const d=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));if(!d.save||!Array.isArray(d.save.team)||!d.save.team.length)return null;
  const s2=d.save;s2.coins=s2.coins||0;s2.supers=s2.supers??1;s2.pos=s2.pos||{};fixTeam(s2);return d}catch(e){return null}}
function showSaveCode(){
  const code=encodeSave(),wrap=document.createElement('div');wrap.className='shop';document.body.appendChild(wrap);const close=()=>wrap.remove();

function opts(list){const a=document.getElementById('act');a.innerHTML=list.map((o,k)=>`<button class="opt" id="${o.id||''}" data-n="${k}" ${o.off?'disabled':''}>${o.label}${o.sub?`<small>${o.sub}</small>`:''}<span class="k">${k+1}</span></button>`).join('');
  a.querySelectorAll('.opt').forEach((b,k)=>{b.onclick=()=>{if(b.disabled)return;SFX.select();list[k].go()};b.onmouseenter=()=>b.focus({preventScroll:true})});focusFirst('#act')}
function menu(){
  document.getElementById('log').textContent=`What will ${nm(active())} do?`;
  opts([{label:'Fight',go:fightMenu},{label:'Net',off:!B.wild,sub:B.wild?(S.supers?`Super nets: ${S.supers}`:'Catch it!'):(B.trainer?"Can't catch a trainer's monster":"Can't catch a champion's monster"),go:netMenu},
    {label:'Switch',off:S.team.filter(m=>m.hp>0).length<2,go:()=>swapMenu(false)},{label:'Run',sub:B.wild?'':'No coins if you run',go:async()=>{lock();if(B.trainer){const ws=WSTATE[B.isle];if(ws){ws.fled=ws.fled||new Set();ws.fled.add(B.trainer.k)}await say(`You ran away from ${B.trainer.name}!`,900);await say('Walk up to them when you are ready for a rematch.',1100)}else if(!B.wild){await say(`You ran away from ${foe()}! Come back when you're ready.`,1200)}else await say('You got away safely!');save();island(B.isle)}}]);
}
function fightMenu(){
  const e=enemy();
  opts([...movesOf(active()).map(m=>{const x=mult(m.el,SP[e.sp].el);return {label:m.name,sub:`${EL[m.el].n}, power ${m.pow}${m.first?', goes first':''}${m.acc?', can miss':''}${x>1?', STRONG!':x<1?', weak':''}`,go:()=>turn(m)}}),{label:'Back',id:'bk',go:menu}]);
}
function netMenu(){
  if(!S.supers)return throwNet(false);
  opts([{label:'Net',sub:'Works best when it is weak',go:()=>throwNet(false)},{label:`Super Net x${S.supers}`,sub:'Always catches',go:()=>throwNet(true)},{label:'Back',id:'bk',go:menu}]);
}
function swapMenu(forced){
  if(forced)document.getElementById('log').textContent='Who will you send out?';
  const list=S.team.map((m,k)=>({label:nm(m),sub:`Lv ${m.lvl}, HP ${Math.max(0,m.hp)}/${maxHp(m)}`,off:m.hp<=0||k===B.pi,go:async()=>{
    lock();B.pi=k;drawSides('p');await say(`Go, ${nm(active())}!`);
    if(!forced){await enemyAttack();if(await faints()!=='ok')return}
    B.busy=false;menu()}}));
  if(!forced)list.push({label:'Back',id:'bk',go:menu});

function enemyMove(e,p){const ms=movesOf(e);if(Math.random()<(B&&!B.wild?.1:.3))return ms[rnd(0,ms.length-1)];return ms.reduce((a,m)=>m.pow*mult(m.el,SP[p.sp].el)>a.pow*mult(a.el,SP[p.sp].el)?m:a)}
async function attack(a,d,mv,side){
  await say(`${side==='e'?(B.wild?'Wild ':'Their '):''}${nm(a)} used ${mv.name}!`,350);
  anim(side==='p'?'part':'eart',side==='p'?'lunge-r':'lunge-l',300);await sleep(120);
  if(mv.acc&&Math.random()>mv.acc){await sleep(250);popText(side==='p'?'eart':'part','MISS','#9fb6d8',30);await say(`${nm(a)} missed!`,500);return}
  await playFx(mv,side);
  let dmg=damage(a,d,mv);let held=false;if(S.team.includes(d)&&(d.joy??50)>=90&&d.hp>1&&dmg>=d.hp&&Math.random()<.35){dmg=d.hp-1;held=true}d.hp=Math.max(0,d.hp-dmg);const x=mult(mv.el,SP[d.sp].el),tid=side==='p'?'eart':'part';
  anim(tid,'hit',550);updTags();popText(tid,'-'+dmg,x>1?'#ffe07a':'#fff',x>1?44:34);if(x>1)setTimeout(()=>popText(tid,'SUPER!','#ff5a3d',26),180);
  if(x>1||mv.pow>=60)anim('arena','shake',400);await sleep(520);
  if(held)await say(`${nm(d)} hung on! It doesn't want to let you down!`,800);
  if(x>1)await say("It's super strong!",500);else if(x<1)await say("It's not very strong...",500);
}
async function enemyAttack(){const e=enemy(),p=active();await attack(e,p,enemyMove(e,p),'e')}
async function turn(mv){
  if(B.busy)return;lock();
  const p=active(),e=enemy(),em=enemyMove(e,p);
  const pf=(mv.first?1:0)-(em.first?1:0);
  const order=(pf>0||(pf===0&&stat(p,3)>=stat(e,3)))?[[p,e,mv,'p'],[e,p,em,'e']]:[[e,p,em,'e'],[p,e,mv,'p']];
  for(const [a,d,m,side] of order){if(a.hp<=0||d.hp<=0)continue;await attack(a,d,m,side);if(await faints()!=='ok')return}
  save();B.busy=false;menu();
}
async function faints(){
  const e=enemy(),p=active();
  if(e.hp<=0){
    SFX.faint();await anim('eart','faint',800);await say(`${B.wild?'Wild ':''}${nm(e)} fainted!`);
    await giveXp(e);
    if(B.ei<B.enemies.length-1){B.ei++;document.getElementById('eart').classList.remove('faint');drawSides('e');
      await say(`${foe()} sends out ${nm(enemy())}!`);B.busy=false;save();menu();return 'next'}
    await winBattle();return 'over';
  }
  if(p.hp<=0){
    SFX.faint();p.joy=Math.max(0,(p.joy||50)-4);await anim('part','faint',800);await say(`${nm(p)} fainted!`);
    document.getElementById('part').classList.remove('faint');
    if(S.team.some(m=>m.hp>0)){save();B.busy=false;swapMenu(true);return 'swap'}
    await loseBattle();return 'over';
  }
  return 'ok';
}
function choose(q,list){return new Promise(res=>{B.choosing=true;document.getElementById('log').textContent=q;opts(list.map(o=>({...o,go:()=>{B.choosing=false;document.getElementById('act').innerHTML='';res(o.val)}})))})}
async function learnMove(m,name,ask){
  if(!canLearn(m.sp,name))return;
  if(m.moves.length<4){m.moves.push(name);SFX.level();await say(`${nm(m)} learned ${name}!`);return}
  if(!ask){const weak=m.moves.reduce((a,b)=>MOVEDEX[b].pow<MOVEDEX[a].pow?b:a);if(MOVEDEX[name].pow>MOVEDEX[weak].pow){m.moves[m.moves.indexOf(weak)]=name;await say(`${nm(m)} forgot ${weak} and learned ${name}!`)}return}
  await say(`${nm(m)} wants to learn ${name}! But it already knows 4 moves.`,300);
  const mv=MOVEDEX[name];
  const pick=await choose(`Forget a move to learn ${name} (${EL[mv.el].n}, power ${mv.pow})?`,[...m.moves.map(n=>({label:'Forget '+n,sub:`${EL[MOVEDEX[n].el].n}, power ${MOVEDEX[n].pow}`,val:n})),{label:`Don't learn ${name}`,id:'bk',val:null}]);
  if(pick){m.moves[m.moves.indexOf(pick)]=name;SFX.level();await say(`1, 2, 3... poof! ${nm(m)} forgot ${pick} and learned ${name}!`)}else await say(`${nm(m)} did not learn ${name}.`)}
function evolveTo(m){const ev=EVO[m.sp];return ev&&m.lvl>=ev[1]?ev[0]:null}
function doEvolve(m){const nx=evolveTo(m);if(!nx)return null;const r=m.hp/maxHp(m),old=m.sp;m.sp=nx;m.hp=Math.max(1,Math.round(maxHp(m)*r));S.caught[nx]=1;return old}
async function evolveInBattle(m,isActive){
  const nx=evolveTo(m);if(!nx)return;const oldName=nm(m);
  await say(`What? ${oldName} is evolving!`,500);
  if(isActive){const pa=document.getElementById('part');if(pa){pa.classList.remove('evolve');void pa.offsetWidth;pa.classList.add('evolve')}
    [523,659,784,1047,784,1047,1319,1568].forEach((f,k)=>tone(f,.25,'triangle',k*.28,.07));await sleep(2400)}
  doEvolve(m);if(isActive)drawSides('p');SFX.win();popText(isActive?'part':'eart','EVOLVED!','#ffe07a',34);
  await say(`Congratulations! ${oldName} evolved into ${nm(m)}!`,1300);save();
}
async function giveXp(e){
  const gain=Math.round(e.lvl*(B.wild?11:18));
  for(const [k,m] of S.team.entries()){
    if(m.hp<=0)continue;const g=k===B.pi?gain:Math.floor(gain/3);m.xp+=g;
    if(k===B.pi)await say(`${nm(m)} got ${g} XP!`,450);
    while(m.xp>=xpNeed(m.lvl)){m.xp-=xpNeed(m.lvl);const old=maxHp(m);m.lvl++;m.hp+=maxHp(m)-old;if(k===B.pi){updTags();const pa=document.getElementById('part');if(pa){const au=document.createElement('div');au.className='aura';pa.appendChild(au);setTimeout(()=>au.remove(),1100)}popText('part','LEVEL UP!','#ffe07a',30)}SFX.level();
      await say(`${nm(m)} grew to level ${m.lvl}!`);movesOf(m);for(const [lv,mvn] of learnset(m.sp))if(lv===m.lvl&&!m.moves.includes(mvn))await learnMove(m,mvn,k===B.pi);await evolveInBattle(m,k===B.pi)}
  }
  save();
}
async function throwNet(sup){
  if(B.busy)return;lock();const e=enemy();
  if(sup){S.supers--;save()}
  await say(sup?'You throw a SUPER NET!':'You throw a net!',400);
  let chance=.2+.7*(1-e.hp/maxHp(e));if(SP[e.sp].rare)chance*=SP[e.sp].legend?.4:.6;if(sup)chance=1;
  const ar=document.getElementById('arena'),ee=document.getElementById('eart'),R0=ar.getBoundingClientRect(),r=ee.getBoundingClientRect();
  const net=document.createElement('div');net.className='net drop';net.style.left=(r.left-R0.left+r.width/2)+'px';net.style.top=(r.top-R0.top+r.height*.55)+'px';net.style.width=r.width*1.05+'px';net.style.height=r.width*.9+'px';
  net.innerHTML=`<svg viewBox="0 0 100 86" width="100%" height="100%"><defs><pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H10M0 0V10" stroke="${sup?'#3fd6ff':'#fff'}" stroke-width="2.2"/></pattern></defs><path d="M6 80 Q4 10 50 6 Q96 10 94 80Z" fill="url(#mesh)" stroke="${sup?'#3fd6ff':'#fff'}" stroke-width="4" opacity=".95"/><path d="M4 80H96" stroke="#ffc83d" stroke-width="7" stroke-linecap="round"/></svg>`;
  ar.appendChild(net);tone(500,.12,'sine');await sleep(460);net.classList.remove('drop');
  const ok=Math.random()<chance,wig=ok?3:rnd(1,2);
  for(let w=0;w<wig;w++){net.classList.remove('wiggle');void net.offsetWidth;net.classList.add('wiggle');tone(300+w*80,.1,'triangle');await sleep(620)}
  if(!ok){net.classList.add('burst');SFX.bump();setTimeout(()=>net.remove(),500)}
  if(ok){
    await anim('eart','caught',800);net.remove();SFX.catch();popText('eart','GOTCHA!','#4be38a',36);
    e.hp=Math.max(1,e.hp);const full=addMon(e);const first=!S.caught[e.sp];S.caught[e.sp]=1;save();
    await say(`Gotcha! You caught ${nm(e)}!`,900);if(full)await say(full,1400);
    if(first)await say(`${nm(e)} was added to your monster book.`,800);
    island(B.isle);return;
  }
  await say(`Oh no! ${nm(e)} broke free!`);
  await enemyAttack();if(await faints()!=='ok')return;
  save();B.busy=false;menu();
}

const PIECES=['The drawing shows waves and a swirl of water. A note on the back says: "Where the sea spins, a door opens."',

async function winBattle(){

  if(B.wild){SFX.win();await say('You won the battle!');save();island(B.isle);return}
  if(B.trainer){const n=Math.round((8+B.enemies.reduce((a,m)=>a+m.lvl,0))*(B.trainer.again?.5:1));SFX.win();await say(`You beat ${B.trainer.name}!`,900);

function playFx(mv,side){

  const burst=(k,c1,c2,n=14,size=1)=>{if(k<=0)return;const e=ease(k);for(let j=0;j<n;j++){const a=j/n*6.28+k,rad=T.s*.55*e*size;ctx.globalAlpha=1-k;ctx.fillStyle=j%2?c1:c2;ctx.beginPath();ctx.arc(T.x+Math.cos(a)*rad,T.y+Math.sin(a)*rad,T.s*.05*(1-k)*size+1,0,7);ctx.fill()}ctx.globalAlpha=1;glow(T.x,T.y,T.s*.6*size*(1-k*.5),c1,.7*(1-k))};

    fire:k=>{const n=big?5:3;for(let j=0;j<n;j++){const kk=clamp((k-j*.08)/.55,0,1);if(kk<=0||kk>=1)continue;const x=lerp(A.x,T.x,kk),y=lerp(A.y,T.y,kk)-Math.sin(kk*3.14)*H0*.18;
        for(let q=0;q<6;q++){const tk=Math.max(0,kk-q*.03);glow(lerp(A.x,T.x,tk),lerp(A.y,T.y,tk)-Math.sin(tk*3.14)*H0*.18,T.s*.12*(1-q/7),'#ffb03a',.6)}glow(x,y,T.s*.16,'#fff1a8');glow(x,y,T.s*.24,'#ff5a1f',.8)}
      if(k>.55){hit();burst((k-.55)/.45,'#ffcf4a','#ff5a1f',big?24:14,big?1.6:1)}},
    water:k=>{if(big){ // a big wave sweeps across

        ctx.beginPath();ctx.moveTo(wx-W0*.6,H0);for(let x=wx-W0*.6;x<=wx;x+=8)ctx.lineTo(x,H0-wh*(.5+.5*Math.sin((x-wx)/40+k*8))*Math.min(1,(x-wx+W0*.6)/(W0*.3)));ctx.quadraticCurveTo(wx+30,H0-wh*1.05,wx+10,H0-wh*.7);ctx.lineTo(wx,H0);ctx.fill();ctx.globalAlpha=1;if(k>.45)hit()}

        if(k>.4&&k<.75){ctx.strokeStyle='#2f8a3a';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(A.x,A.y);const vk=(k-.4)/.35;ctx.quadraticCurveTo((A.x+T.x)/2,Math.min(A.y,T.y)-H0*.3*(1-vk),T.x,T.y);ctx.stroke()}}

    stone:k=>{const rock=(x,y,s,a)=>{ctx.save();ctx.translate(x,y);ctx.rotate(a);const g=ctx.createLinearGradient(-s,-s,s,s);g.addColorStop(0,'#c9b8a4');g.addColorStop(1,'#6a5a4a');ctx.fillStyle=g;ctx.beginPath();for(let j=0;j<7;j++){const r=s*(.75+.25*Math.sin(j*2.3));ctx.lineTo(Math.cos(j*.9)*r,Math.sin(j*.9)*r)}ctx.fill();ctx.restore()};
      if(big){const kk=clamp(k/.55,0,1),y=lerp(-T.s,T.y,kk*kk);if(kk<1)rock(T.x,y,T.s*.4,kk*4);else{hit();const b=(k-.55)/.45;rock(T.x,T.y+b*20,T.s*.4*(1-b*.3),4);for(const p of parts.slice(0,20)){ctx.globalAlpha=1-b;ctx.fillStyle='#a8957e';ctx.beginPath();ctx.arc(T.x+Math.cos(p.a)*T.s*.8*b*p.s,T.y+T.s*.3-Math.abs(Math.sin(p.a))*T.s*.5*b,4+p.s*5,0,7);ctx.fill()}ctx.globalAlpha=1}}
      else{for(let j=0;j<3;j++){const kk=clamp((k-j*.1)/.55,0,1);if(kk<=0||kk>=1)continue;rock(lerp(A.x,T.x,kk)+(j-1)*12,lerp(A.y,T.y,kk)-Math.sin(kk*3.14)*H0*.3,T.s*.1,kk*9)}if(k>.6){hit();burst((k-.6)/.4,'#d8c8b0','#8a7a66',12)}}},
    storm:k=>{const bolt=(x1,y1,x2,y2,w,seed)=>{const r=rng(seed);ctx.strokeStyle='#fff9b0';ctx.shadowColor='#fff27a';ctx.shadowBlur=18;ctx.lineWidth=w;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x1,y1);for(let j=1;j<=8;j++){const q=j/8;ctx.lineTo(lerp(x1,x2,q)+(j<8?(r()-.5)*36:0),lerp(y1,y2,q)+(j<8?(r()-.5)*18:0))}ctx.stroke();ctx.shadowBlur=0};
      const fl=Math.floor(k*14);if(big){for(let j=0;j<3;j++)if((fl+j)%2===0&&k<.85)bolt(T.x+(j-1)*T.s*.3,-10,T.x+(j-1)*T.s*.1,T.y,4,fl*7+j);if(k>.15)hit();glow(T.x,T.y,T.s*.8,'#fff27a',.5*(1-k))}
      else{if(k<.7&&fl%2===0)bolt(A.x,A.y,T.x,T.y,3,fl);if(k>.2){hit();burst((k-.2)/.8,'#fff9b0','#ffd23a',12)}}},
    shadow:k=>{if(big){ctx.fillStyle=`rgba(20,0,40,${.45*Math.sin(k*3.14)})`;ctx.fillRect(0,0,W0,H0);for(let j=0;j<4;j++){const kk=clamp((k-j*.12)/.6,0,1);if(kk<=0||kk>=1)continue;ctx.strokeStyle=`rgba(190,140,255,${1-kk})`;ctx.lineWidth=6*(1-kk)+1;ctx.beginPath();ctx.arc(T.x,T.y,T.s*(.1+kk*.9),0,7);ctx.stroke()}if(k>.3)hit()}
      else{for(let j=0;j<5;j++){const kk=clamp((k-j*.07)/.65,0,1);if(kk<=0||kk>=1)continue;const ang=kk*9+j*1.3,x=lerp(A.x,T.x,kk)+Math.cos(ang)*22,y=lerp(A.y,T.y,kk)+Math.sin(ang)*22;for(let q=0;q<5;q++)glow(x-Math.cos(ang)*q*5,y-Math.sin(ang)*q*5,10-q,'#b088ff',.7);glow(x,y,7,'#f2e6ff')}if(k>.62){hit();burst((k-.62)/.38,'#c7a6ff','#5a2ab0',12)}}}
  };
  const f=fx[el]||fx.none;
  return new Promise(res=>{const step=()=>{const k=Math.min(1,(performance.now()-t0)/dur);ctx.clearRect(0,0,W0,H0);try{f(k)}catch(e){}if(k<1&&cv.isConnected)requestAnimationFrame(step);else{ctx.clearRect(0,0,W0,H0);if(!hitDone)SFX.hit();res()}};requestAnimationFrame(step)});
}

// ================= KEYBOARD =================
const DIRK={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
function gridNav(sel,cols,d){const bs=[...document.querySelectorAll(sel+' button')];if(!bs.length)return;let i=bs.indexOf(document.activeElement);
  if(i<0){const f=bs.find(b=>!b.disabled);f&&f.focus();return}const step={left:-1,right:1,up:-cols,down:cols}[d];
  let j=i;for(let n=0;n<bs.length;n++){j+=step;if(j<0||j>=bs.length)return;if(!bs[j].disabled){bs[j].focus({preventScroll:true});SFX.select();return}}}
addEventListener('keydown',e=>{
  const d=DIRK[e.code],n=parseInt(e.key,10);
  if(SCREEN==='room'&&ROOM){
    if(!ROOM.paused&&d){e.preventDefault();if(e.repeat&&ROOM.heldKey===d)return;ROOM.held=d;ROOM.heldKey=d;return}
    if(e.key==='Escape'&&!ROOM.paused){leaveHouse();return}return}
  if(SCREEN==='island'&&WORLD){
    if(e.key==='-'||e.key==='_'){e.preventDefault();zoom(1);return}if(e.key==='+'||e.key==='='){e.preventDefault();zoom(-1);return}if(e.key==='z'||e.key==='Z'){zoom(WORLD.z===3?-3:1);return}
    if(!WORLD.paused&&d){e.preventDefault();if(e.repeat&&WORLD.heldKey===d)return;WORLD.held=d;WORLD.heldKey=d;return}
    if(WORLD.paused&&d){e.preventDefault();gridNav('#prompt',2,d==='up'?'left':d==='down'?'right':d);return}
    return;
  }
  if(SCREEN==='battle'&&B){
    if(B.busy&&!B.choosing&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();SKIP=true;return}
    if(n>=1&&n<=9){const bs=[...document.querySelectorAll('#act .opt')];if(bs[n-1]&&!bs[n-1].disabled){e.preventDefault();bs[n-1].click()}return}
    if(e.code==='Escape'||e.code==='Backspace'){const bk=document.getElementById('bk');if(bk){e.preventDefault();bk.click()}return}
    if(d){e.preventDefault();gridNav('#act',2,d)}
    return;
  }
  if(SCREEN==='map'&&n>=1&&n<=5){e.preventDefault();if(MAPVIEW&&MAPVIEW.pick)MAPVIEW.pick(n-1);else goIsland(n-1);return}
  if(SCREEN==='starter'&&n>=1&&n<=4){e.preventDefault();if(n===4)document.getElementById('own').click();else app.querySelectorAll('[data-s]')[n-1].click();return}
  if(d&&['title','starter','team','win','map'].includes(SCREEN)&&!e.code.startsWith('Key')){const bs=[...app.querySelectorAll('button:not([disabled])')].filter(b=>b.offsetParent);const i=bs.indexOf(document.activeElement);if(bs.length){e.preventDefault();const j=Math.max(0,Math.min(bs.length-1,i+((d==='right'||d==='down')?1:-1)));bs[i<0?0:j].focus()}}
});
addEventListener('keyup',e=>{if(ROOM&&DIRK[e.code]&&DIRK[e.code]===ROOM.heldKey){ROOM.held=null;ROOM.heldKey=null}if(WORLD&&DIRK[e.code]&&DIRK[e.code]===WORLD.heldKey){WORLD.held=null;WORLD.heldKey=null}});
addEventListener('blur',()=>{if(WORLD)WORLD.held=null});


Promise.all([loadMonImages(),document.fonts?document.fonts.ready.catch(()=>{}):0]).then(()=>{
  // build the island art a little at a time so the page stays responsive
  let k=0;const step=()=>{if(k<MAIN){buildTex(k++);setTimeout(step,0)}else{buildSea();title()}};step()});
</script>
